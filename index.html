  S.gameOver=true; S.phase="done";
  hr();
  extra((S.nickname?("「"+S.nickname+"」"):"")+S.name+" 宣布引退──"+reason);
  head("引退特刊", "野球人生報・生涯回顧號");
  story("記者會上，你把帽簷壓低又抬起，說完最後一句「謝謝棒球」，快門聲淹沒了會場。");
  // 生涯年表
  if(S.proYears.length && !ensureStatBook().games.length){
    let tb='<table class="career"><tr><th>年度</th><th>年齡</th><th>球隊</th><th>成績</th></tr>';
    S.proYears.forEach(y=>{
      tb+='<tr><td>'+y.year+'</td><td>'+y.age+'</td><td>'+esc(y.team)+'</td><td>'+esc(y.line)+'</td></tr>';
    });
    tb+='</table>';
    out("【生涯年表】"+tb,"story");
  }
  out("【分賽事生涯成績】"+renderStatBookHTML(),"story");
  if((S.contracts||[]).length) out("【合約與 FA 年資】"+renderContractHTML(),"story");
  const txHtml=renderTransactionsHTML();
  if(txHtml) out("【球隊異動史】"+txHtml,"story");
  // 頭銜
  if(S.honors.length){
    out("【生涯榮譽】"+esc(S.honors.join("、")),"story");
  }
  sys("職業年資："+S.proYears.length+"年　生涯總收入："+fmtMoney(S.earnings)+"　最終知名度："+S.fame);
  next(null, ()=>{
    // 名人堂與後日談
    const hof=(S.flags.hof||0)+S.fame*0.5+S.proYears.length*5;
    if(hof>=220){
      extra("名人堂全票通過！背號在"+(S.team||"母隊")+"永久退休");
      story("多年後，海線高中的球場翻新了。入口的銅牌上刻著你的名字——和一行字：「每一顆球都算數。」");
    }else if(hof>=120){
      story("引退後你回到台灣，在青棒基層執教。海線高中的小球員們都聽過你的故事。");
    }else if(S.proYears.length>0){
      story("職業生涯不長，但那些站上球場的日子，誰也拿不走。你在家鄉開了間棒球教室。");
    }else{
      story("你脫下釘鞋，換上皮鞋。但每個週末的河堤，還是有你揮棒的影子。");
    }
    if(S.married){ story(GF[S.gf].name+"牽著孩子的手在台下。孩子手上，是一顆簽了你名字的球。"); }
    else if(S.gf){ story("台下，"+GF[S.gf].name+"用力揮著手，像高中那年一樣。"); }
    finalCard();
  });
}
function finalCard(){
  const roleHand=S.twoWay?handLabel():(S.pos==="P"?"投手":"野手")+"・"+handLabel();
  hr(); head("選手最終能力", (S.nickname?("「"+S.nickname+"」"):"")+S.name+"（"+roleHand+"）");
  let card;
  if(S.pos==="P"){
    card = '<div class="statgrid">'
      +'<div class="cell">球速 <b>'+S.velo+' km/h</b></div>'
      +'<div class="cell">控球 '+rk(rankPow(S.ctrl))+' <b>'+S.ctrl+'</b></div>'
      +'<div class="cell">耐力 '+rk(rankPow(S.stam))+' <b>'+S.stam+'</b></div>'
      +'<div class="cell">變化球 <b>'+(Object.entries(S.breaks).map(([k,v])=>k+" Lv"+v).join("、")||"無")+'</b></div>'
      +'<div class="cell" style="grid-column:1/-1">特殊能力 <b>'+(S.abil.join("、")||"—")+'</b></div></div>';
    if(S.twoWay){
      card += '<div class="statgrid">'
        +'<div class="cell">彈道 <b>'+S.traj+'</b>（'+TRAJN[S.traj]+'）</div>'
        +'<div class="cell">接觸 '+rk(rankOf(S.meet))+' <b>'+S.meet+'</b></div>'
        +'<div class="cell">力量 '+rk(rankPow(S.power))+' <b>'+S.power+'</b></div>'
        +'<div class="cell">跑力 '+rk(rankOf(S.run))+' <b>'+S.run+'</b></div>'
        +'<div class="cell">肩力 '+rk(rankOf(S.arm))+' <b>'+S.arm+'</b></div>'
        +'<div class="cell">守備 '+rk(rankOf(S.fld))+' <b>'+S.fld+'</b></div></div>';
    }
  }else{
    card = '<div class="statgrid">'
      +'<div class="cell">彈道 <b>'+S.traj+'</b>（'+TRAJN[S.traj]+'）</div>'
      +'<div class="cell">接觸 '+rk(rankOf(S.meet))+' <b>'+S.meet+'</b></div>'
      +'<div class="cell">力量 '+rk(rankPow(S.power))+' <b>'+S.power+'</b></div>'
      +'<div class="cell">跑力 '+rk(rankOf(S.run))+' <b>'+S.run+'</b></div>'
      +'<div class="cell">肩力 '+rk(rankOf(S.arm))+' <b>'+S.arm+'</b></div>'
      +'<div class="cell">守備 '+rk(rankOf(S.fld))+' <b>'+S.fld+'</b></div>'
      +'<div class="cell" style="grid-column:1/-1">特殊能力 <b>'+(S.abil.join("、")||"—")+'</b></div></div>';
  }
  out(card,"story");
  sys("種子："+S.seed+"　（同種子＋同選擇＝同樣的野球人生）");
  const same={seed:S.seed,name:S.name,pos:S.pos,opts:{hand:S.hand,throwHand:S.throwHand,twoWay:S.twoWay}};
  choices([
    {label:"用新種子再活一次", fn:()=>startScreen(), primary:true, noEcho:true},
    {label:"用同一個種子重走人生", fn:()=>initGame(same.seed, same.name, same.pos, same.opts), noEcho:true},
  ]);
}
/* ================= 頭版 / 初始化 ================= */
function startScreen(){
  S=null; statusBar();
  $log().innerHTML="";
  head("創刊號・你的野球人生", "從海線高中的長草外野，到世界的舞台");
  story("這是一款台灣背景的純文字棒球人生模擬遊戲。");
  sys("・高中三年（每週制）：練習、讀書、戀愛、黑豹旗與木棒聯賽。\n・比賽全自動：由能力值×特性×左右對決×狀態加權擲骰，呈現報紙式戰報；特性從表現自動養成。\n"
     +"・畢業分歧：大學／中職選秀（CPBL）／旅日（NPB）／旅美（MLB）──由成績、球探註記與學測決定選項。\n"
     +"・職業生涯：每場比賽選擇「全力／一般／養生」，重要度★～★★★。\n"
     +"・國際賽（12強、經典賽）、旅外跳點、婚姻、衰退曲線、引退回顧特刊。\n"
     +"・種子決定隨機性：同種子＋同選擇＝同樣的人生。隨時可匯出存檔碼。");
  const urlSeed = new URLSearchParams(location.search).get("seed");
  choices([
    {label:"開始新的人生", fn:()=>setupName(urlSeed), primary:true, noEcho:true},
    {label:"讀取存檔", fn:()=>{
      const code=prompt("貼上存檔碼：");
      if(code) loadCode(code); else startScreen();
    }, noEcho:true},
  ]);
}
function setupName(urlSeed){
  hr(); head("選手登錄", "海線高中棒球隊・入隊申請書");
  const seed = urlSeed || randSeed();
  out('姓名：<input id="inpName" maxlength="8" placeholder="林海" style="padding:6px;font-size:.95rem;width:140px;">　'
     +'種子：<input id="inpSeed" value="'+esc(seed)+'" maxlength="16" style="padding:6px;font-size:.95rem;width:120px;">',"sys");
  choices([
    {label:"野手（打擊為主）", fn:()=>go("B"), noEcho:true},
    {label:"投手（配球為主）", fn:()=>go("P"), noEcho:true},
    {label:"二刀流（投打雙修｜體力上限較低、練習負荷較高）", fn:()=>go("TW"), noEcho:true},
  ],"選擇你的路線：");
  function go(pos){
    const nm=(document.getElementById("inpName").value.trim())||"林海";
    const sd=(document.getElementById("inpSeed").value.trim())||seed;
    if(pos==="B"){
      choices([
        {label:"右打", fn:()=>initGame(sd,nm,pos,{hand:"R"}), noEcho:true},
        {label:"左打（近一壘：內野安打+、雙殺-；常吃反手優勢）", fn:()=>initGame(sd,nm,pos,{hand:"L"}), noEcho:true},
        {label:"左右開弓（永遠反手優勢；初始接觸-1、接觸升級成本+15%）", fn:()=>initGame(sd,nm,pos,{hand:"S"}), noEcho:true},
      ],"選擇打席：");
    }else if(pos==="TW"){
      choices([
        {label:"右投左打（大谷型）", fn:()=>initGame(sd,nm,"P",{hand:"L",throwHand:"R",twoWay:true}), noEcho:true},
        {label:"右投右打", fn:()=>initGame(sd,nm,"P",{hand:"R",throwHand:"R",twoWay:true}), noEcho:true},
        {label:"左投左打（稀少價值：選秀評價+、天生剋左打）", fn:()=>initGame(sd,nm,"P",{hand:"L",throwHand:"L",twoWay:true}), noEcho:true},
      ],"選擇二刀流慣用手：投打共用能力點，必須取捨養成方向。");
    }else{
      choices([
        {label:"右投右打", fn:()=>initGame(sd,nm,pos,{hand:"R",throwHand:"R"}), noEcho:true},
        {label:"左投左打（稀少價值：選秀評價+、天生剋左打）", fn:()=>initGame(sd,nm,pos,{hand:"L",throwHand:"L"}), noEcho:true},
      ],"選擇投打：");
    }
  }
}
function initGame(seed, name, pos, hd){
  seedRNG(seed, 0);
  S=newState(seed, name, pos);
  if(hd){ S.hand=hd.hand||"R"; S.throwHand=hd.throwHand||"R"; }
  S.twoWay=!!(hd&&hd.twoWay);
  if(S.hand==="S"){ S.meet=Math.max(1,S.meet-1); }
  if(pos==="P"){ S.breaks={"曲球":1}; }
  if(S.twoWay){
    /* 16 歲同時練投打仍很生澀：雙面都有底子，但沒有一面能吃滿單一路線資源。 */
    S.velo=Math.max(100,S.velo-2);
    S.ctrl=Math.max(1,S.ctrl-6);
    S.stam=Math.max(1,S.stam-4);
    S.power=Math.max(1,S.power-4);
    S.run=Math.max(1,S.run-1);
    S.fld=Math.max(1,S.fld-1);
    /* 雙重課表壓縮恢復空間；暑訓與休息仍沿用既有體力機制。 */
    S.maxHp=90;
    S.hp=65;
  }
  $log().innerHTML="";
  statusBar();
  sys("種子："+seed+"　路線："+(S.twoWay?"二刀流":pos==="P"?"投手":"野手"));
  if(S.twoWay) sys("二刀流代價：投打共用三系能力點；體力上限90，非保養練習體力消耗+15%、受傷風險+25%。");
  opening();
}

/* 裝備道具的練習加成 */
const _origPractice = practice;
practice = function(kind){
  let msg=null;
  if(S.items.includes("飛翔球棒") && ["suburi","toss"].includes(kind)){ S.expG+=3; msg="【飛翔球棒】技術+3"; }
  if(S.items.includes("職人手套") && kind==="knock"){ S.expG+=2; S.expS+=2; msg="【職人手套】技+2敏+2"; }
  if(S.items.includes("疾風釘鞋") && ["dash","run"].includes(kind)){ S.expS+=3; msg="【疾風釘鞋】+3"; }
  if(msg) sys("裝備加成："+msg);
  _origPractice(kind);
};

window.addEventListener("DOMContentLoaded", startScreen);

</script>
