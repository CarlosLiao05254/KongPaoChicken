function quickEventBat(choice,diff){
  if(!(S.pos==="B"||S.twoWay))return null;
  const b=emptyBat(),pa=4;
  const mod=choice==="full"?0.035:choice==="rest"?-0.045:0;
  const env=leagueEnv(),LSq=leagueShift();
  const mQ=effRating("meet",S)+LSq,pQ=effRating("power",S)+LSq,eyQ=effRating("eye",S)+LSq;
  const pHit=Math.max(0.06,Math.min(0.40,0.262+(mQ-85)*0.0045+(pQ-85)*0.0004-diff*0.012+mod+env.hit));
  for(let i=0;i<pa;i++){
    b.pa++;
    if(chance(Math.max(0.02,Math.min(0.16,0.033+(eyQ-55)*0.0017)))){b.bb++;continue;}
    b.ab++;
    if(chance(pHit)){b.h++;if(chance(Math.max(0.005,Math.min(0.3,(0.1026+(pQ-85)*0.0081+(S.traj-2)*0.012+mod)*env.hrMul)))){b.hr++;b.rbi+=1+ri(0,2);}else{if(chance(0.22))b.d2++;if(chance(0.3))b.rbi++;}}
    else if(chance(Math.max(0.06,0.19-(mQ-85)*0.0028+env.k)))b.so++;
  }
  if((b.h+b.bb)>0&&chance(Math.max(0.02,(effRating("run",S)+LSq-78)*0.004)))b.sb=1;
  return b;
}
function quickEventPit(choice,diff,innings){

  const mod=choice==="full"?0.7:choice==="rest"?-0.8:0;
  const q=(pitchQuality(S)+leagueShift())/22-diff*0.12+mod+armPerformanceMod()*2-leagueEnv().eraAdd*0.6;

}

function postSeason(rank,goodSeason,rating,seasonLevel){
  if(S.flags.rehab){
    sys("復健球季：球團依醫療建議將你排除於季後賽名單之外——十月的球場，你在復健室看轉播。");
    offSeason(goodSeason,rating,false);return;
  }
  const playedLevel=seasonLevel||S.level;
  // 用本季實際層級判定：二軍／小聯盟球季不會因季末升格而誤闖頂級季後賽。
  if(!topServiceLevel(S.league,playedLevel)){
    offSeason(goodSeason,rating,false);return;
  }
  const route=postseasonRoute(S.league,rank);
  S.flags.lastPostseasonPath={year:S.year,league:S.league,rank:route.rank,qualified:route.qualified,
    byes:route.byes.slice(),rounds:[],titlePath:route.titlePath,championshipQualified:false};
  if(!route.qualified){offSeason(goodSeason,rating,false);return;}
  if(route.byes.length)sys("季後賽輪空："+route.byes.join("、")+"。"+route.titlePath+"。");
  playCompressedPostseasonRound(route,0,goodSeason,rating,playedLevel);
}
function playCompressedPostseasonRound(route,index,goodSeason,rating,seasonLevel){
  if(index>=route.rounds.length){
    S.flags.lastPostseasonPath.championshipQualified=true;
    playoffSeries(goodSeason,rating,seasonLevel);return;
  }
  const rule=route.rounds[index],foe=postseasonOpponent(rule);
  hr();head(rule.title,rule.format);
  story("為保留多年生涯的節奏，本輪以一場關鍵戰代表整個系列賽；勝者晉級，敗者立即淘汰。");
  if(rule.key==="PRO.NPB.CLIMAX_FINAL"&&route.rank===1)sys("聯盟優勝優勢：依 Final Stage 制度先帶一勝，已反映在晉級率。");
  const menu=[
    {label:"全力搶晉級",choice:"full"},{label:"照既定調度",choice:"norm"},{label:"保守應戰",choice:"rest"}
  ];
  choices(menu.map(m=>({label:m.label,fn:()=>settle(m.choice)})),
    rule.title+" vs "+foe+"　季後種子第"+route.rank+"　疲勞"+Math.round(S.fatigue)+"　輸球即淘汰");
  function settle(choice){
    S.fatigue=Math.max(0,Math.min(100,S.fatigue+(choice==="full"?5:choice==="rest"?-3:2)*(S.twoWay?1.25:1)));
    const p=postseasonRoundWinProbability(rule,route.rank,choice),roll=postseasonRoundSeedRoll(rule),win=roll<p;
    const line=recordQuickEvent({id:S.seed+"::"+rule.key+"::"+S.year+"::"+rule.roundKey,
      competitionKey:rule.key,editionKey:rule.key+"."+S.year,roundKey:rule.roundKey,
      league:S.league,level:seasonLevel,opponent:foe,result:win?"W":"L",choice:choice,difficulty:rule.difficulty,
      innings:effectivePitchRole()==="SP"?9:2});
    const result={key:rule.key,editionKey:rule.key+"."+S.year,roundKey:rule.roundKey,title:rule.title,
      opponent:foe,result:win?"W":"L",winProbability:Number(p.toFixed(4)),seedRoll:Number(roll.toFixed(6))};
    S.flags.lastPostseasonPath.rounds.push(result);
    gameLine(rule.title+(win?"　晉級！":"　敗退……")+(line?("　你："+line):""));
    const proceed=()=>{
      if(win){
        if(choice==="full")S.fame+=2;
        next(null,()=>playCompressedPostseasonRound(route,index+1,goodSeason,rating,seasonLevel));
      }else{
        story("季後賽旅程在"+rule.title+"結束；不會再進入後續輪次或冠軍系列賽。");
        S.fame+=3;next(null,()=>offSeason(goodSeason,rating,false));
      }
    };
    if(S.flags.pendingArmCrisis){
      delete S.flags.pendingArmCrisis;
      if(resolveArmCrisis(proceed,{forced:false,sea:S.sea}))return;
    }
    proceed();
  }
}
function championshipSeriesRule(league){
  if(league==="CPBL")return {title:"台灣大賽",key:"PRO.CPBL.TAIWAN_SERIES"};
  if(league==="NPB")return {title:"日本一決定戰",key:"PRO.NPB.JAPAN_SERIES"};
  return {title:"世界大賽",key:"PRO.MLB.WORLD_SERIES"};
}
function championshipPitchScheduled(role,gameNo){
  // 本作壓縮了移動日，但不壓縮投手輪值：先發休四戰，後援錯開出賽。
  if(role==="SP")return gameNo===1||gameNo===5;
  if(role==="MR")return gameNo===1||gameNo===3||gameNo===5||gameNo===7;
  if(role==="CL")return gameNo===2||gameNo===4||gameNo===6||gameNo===7;
  return false;
}
function playoffSeries(goodSeason, rating, seasonLevel){
  seasonLevel=seasonLevel||S.level;
  hr();
  const rule=championshipSeriesRule(S.league),title=rule.title,poKey=rule.key;
  head(title, "冠軍系列賽・七戰四勝（先取四勝）");
  story("主客場移動日在文字流程中壓縮處理，但每一戰都會單獨結算並記錄；任一方必須先拿到第四勝才是冠軍，系列賽會打四至七場。");
  const seriesPitchRole=S.pos==="P"?effectivePitchRole():null;
  if(S.pos==="P"){
    const role=seriesPitchRole;
    const plan=role==="SP"?"先發輪值：第1、5戰":role==="MR"?"中繼排程：第1、3、5、7戰":role==="CL"?"終結者排程：第2、4、6、7戰":"醫療管制：本系列賽不登板";
    sys(plan+(S.twoWay?"；二刀流在非登板日仍以打者出賽。":"；其餘場次依輪值休息。"));
  }
  let w=0,l=0, g=0;
  const foe=foeName();
  playPO();
  function playPO(){
    if(w>=4||l>=4){ poEnd(); return; }
    g++;
    const role=seriesPitchRole;
    const pitchingToday=S.pos==="P"&&effectivePitchRole()!=="OUT"&&championshipPitchScheduled(role,g);
    const battingToday=S.pos==="B"||S.twoWay;
    const activeToday=pitchingToday||battingToday;
    const gameLabel=title+" 第"+g+"戰　目前"+w+"勝"+l+"敗　疲勞"+Math.round(S.fatigue)+
      "　"+(pitchingToday?pitchRoleLabel(role)+"登板":battingToday?"打者出賽":"輪值休息")+"　重要度★★★";
    if(activeToday){
      choices([
        {label:"全力出賽", fn:()=>po("full",role,pitchingToday,battingToday)},
        {label:"一般出賽", fn:()=>po("norm",role,pitchingToday,battingToday)},
        {label:"養生調整", fn:()=>po("rest",role,pitchingToday,battingToday)},
      ], gameLabel);
    }else{
      choices([{label:"依輪值休息・觀戰",fn:()=>po("off",role,false,false)}],gameLabel);
    }
    function po(c,role,pitchingToday,battingToday){
      const activeToday=pitchingToday||battingToday;
      if(activeToday)S.fatigue+=(c==="full"?6:c==="norm"?3:-5)*(S.twoWay&&c!=="rest"?1.35:1);
      else S.fatigue=Math.max(0,S.fatigue-4);
      const pm=activeToday?perfMod(c)+(c==="rest"?-0.05:0):0;
      const activeOverall=pitchingToday&&battingToday?overall():pitchingToday?ovP():battingToday?ovB():50;
      const teamBase=0.44+((S.flags.teamStr||50)-50)*0.004;
      const winP=teamBase+(activeToday?(activeOverall-50)*0.004+pm*0.3:0)+
        traitGameEdge({keyGame:true,batting:battingToday});
      const win=chance(Math.max(0.15,Math.min(0.8,winP)));
      const savedRole=S.currentPitchRole;
      if(S.pos==="P"&&!pitchingToday)S.currentPitchRole="OUT";
      const statLine=recordQuickEvent({id:S.seed+"::"+poKey+"::"+S.year+"::g"+g,competitionKey:poKey,
        editionKey:poKey+"."+S.year,roundKey:"game"+g,league:S.league,level:seasonLevel,
        opponent:foe,result:win?"W":"L",choice:c,difficulty:9,
        innings:pitchingToday?(role==="SP"?7:role==="MR"?2:1):0});
      S.currentPitchRole=savedRole;
      const appearance=statLine?("　你："+statLine):(S.pos==="P"&&!S.twoWay?"　你：依輪值未登板":"");
      if(win){w++;gameLine("　第"+g+"戰 勝！"+(c==="full"?"你是今日英雄！":"")+appearance);if(c==="full")S.fame+=4;}
      else {l++;gameLine("　第"+g+"戰 敗……"+(c==="rest"&&activeToday?"（養生的代價？輿論不小）":"")+appearance);if(c==="rest"&&activeToday)S.fame=Math.max(0,S.fame-3);}
      if(!pitchingToday)recoverArm(1,false);
      if(g===2||g===5){recoverArm(1,true);S.fatigue=Math.max(0,S.fatigue-5);sys("系列賽移動／休兵日：全身與手臂得到恢復。");}
      if(S.flags.pendingArmCrisis){delete S.flags.pendingArmCrisis;if(resolveArmCrisis(playPO,{forced:false,sea:S.sea}))return;}
      next(null, playPO);
    }
  }
  function poEnd(){
    const champion=w===4;
    S.flags.lastChampionshipSeries={year:S.year,competitionKey:poKey,title:title,wins:w,losses:l,games:g,champion:champion};
    if(champion){
      extra(S.team+" 奪下"+title+"冠軍！！");
      S.honors.push(S.year+" "+title+"冠軍"); S.fame+=20; S.flags.hof=(S.flags.hof||0)+30;
      story("香檳噴滿更衣室。你抱著獎盃，想起海線那片長草的外野。");
      const m=spGain(12,12,12);
      gain("大賽淬鍊——冠軍舞台的壓力化為血肉："+m);
    }else{
      story("系列賽落敗……但站上最終舞台的經驗，已刻進身體。");
      S.fame+=8;
      const m=spGain(6,6,6);
      gain("大賽經驗："+m);
    }
    next(null, ()=>offSeason(goodSeason, rating, champion));
  }
}

/* ---- 休賽季 ---- */
function rosterSnapshot(){
  return {team:S.team||null,league:S.league||null,level:S.level||null,salary:Number.isFinite(S.salary)?Math.round(S.salary):null};
}
function teamPoolForLeague(league){
  return league==="CPBL"?CPBL_TEAMS:league==="NPB"?NPB_TEAMS:MLB_TEAMS;
}
function recordRosterTransaction(type,from,to,note){
  if(!Array.isArray(S.transactions)) S.transactions=[];
  const seq=S.transactions.filter(t=>Number(t.year)===Number(S.year)).length+1;
  const row={id:S.seed+"::TX::"+S.year+"::"+seq,year:S.year,age:S.age,type:type,
    from:{team:from&&from.team||null,league:from&&from.league||null,level:from&&from.level||null,salary:from&&Number.isFinite(from.salary)?Math.round(from.salary):null},
    to:{team:to&&to.team||null,league:to&&to.league||null,level:to&&to.level||null,salary:to&&Number.isFinite(to.salary)?Math.round(to.salary):null},
    contractId:S.contract&&S.contract.id||null,contractYearsLeft:S.contract&&S.contract.yearsLeft||0,note:note||""};
  if(!S.transactions.some(t=>t.id===row.id)) S.transactions.push(row);
  return row;
}
function commitNextSeason(){ S.flags.committedNextSeasonYear=S.year;S.flags.employmentResolvedYear=S.year; }
function clearRehabAfterSeason(){
  if(!S.flags.rehab||Number(S.flags.rehabSeasonYear||S.year)>S.year) return false;
  S.flags.rehab=0; delete S.flags.rehabSeasonYear;
  return true;
}
function applyRosterMove(type,to,note){
  if(S.flags.rosterMoveYear===S.year||S.flags.employmentResolvedYear===S.year) return null;
  const from=rosterSnapshot();
  const dest={team:to.team,league:to.league||S.league,level:to.level||S.level};
  if(from.team===dest.team&&from.league===dest.league&&from.level===dest.level) return null;
  const row=recordRosterTransaction(type,from,Object.assign({},dest,{salary:Number.isFinite(to.salary)?to.salary:S.salary}),note);
  const crossed=from.league!==dest.league;
  S.team=dest.team; S.league=dest.league; S.level=dest.level;
  if(crossed) S.leagueYears=0;
  if(Number.isFinite(to.salary)) S.salary=Math.max(60,Math.round(to.salary));
  S.flags.teamStr=Number.isFinite(to.teamStr)?to.teamStr:ri(42,60);
  S.flags.rosterMoveYear=S.year;
  commitNextSeason();
  S.flags.lowPerfYears=0;
  if(type==="TRADE"){
    S.flags.tradeHeat=0;
    if(S.contract){S.contract.team=S.team;S.contract.league=S.league;S.contract.level=S.level;syncContractHistory(S.contract);}
  }
  return row;
}
function isTopProLevel(){ return S.level==="一軍"||S.level==="MLB"; }
function tradeToNewTeam(note){
  const pool=teamPoolForLeague(S.league).filter(t=>t!==S.team);
  if(!pool.length) return false;
  const old=S.team,team=pick(pool);
  const row=applyRosterMove("TRADE",{team:team,league:S.league,level:S.level},note||"球季結束後交易成局");
  if(!row) return false;
  extra(old+"與"+team+"完成交易，"+S.name+"下季改披"+team+"戰袍！");
  return true;
}
function offseasonTradeCheck(rating,done){
  if(!isTopProLevel()||S.flags.rosterMoveYear===S.year){ done(false); return; }
  const starLine={CPBL:48,NPB:57,MLB:63}[S.league]||60;
  const star=overall()>=starLine||rating>=65||S.fame>=100;
  let p=0.15+Math.min(0.2,S.flags.tradeHeat||0)+(S.traits.cancer?0.25:0)+(S.traits.ambience?0.20:0);
  if(rating<35) p+=0.08;
  if(!chance(Math.min(0.85,p))){ done(false); return; }
  hr();
  if(S.flags.franchiseTeam===S.team||S.traits.franchise||S.traits.mrteam){
    head("非賣品", "他隊詢價，球團直接回絕");
    story("高層連會議都沒開就拒絕了報價——你已是這座城市與這件球衣的象徵。");
    done(false); return;
  }
  if(star&&S.traits.cancer){
    head("交易成局", "球團決定結束更衣室拉鋸");
    story("明星身手仍在，但長期的更衣室衝突讓高層不再徵詢否決權。");
    const moved=tradeToNewTeam("更衣室衝突後球團完成季末交易");done(!!moved);return;
  }
  if(star){
    head("交易報價", "球團徵詢明星球員的交易否決權");
    choices([
      {label:"點頭同意，換個環境", fn:()=>{ tradeToNewTeam("明星球員同意季末交易"); done(true); }},
      {label:"行使否決權，我要留下（下一張合約市場價 -15%、球隊戰力 -3）", fn:()=>{
        S.flags.tradeVetoPenalty=1; S.flags.teamStr=Math.max(35,(S.flags.teamStr||50)-3);
        commitNextSeason();
        story("你選擇留下。既有保障年薪不受影響，但下一張合約的市場估值會反映這次拉鋸。");
        done(false);
      }},
    ],"交易會在休賽季完成；本季成績仍完整屬於原隊。");
    return;
  }
  head("季末交易傳言", "媒體：球團正在聽取報價");
  choices([
    {label:"公開抱怨，要求球團說清楚（60% 成交）", fn:()=>{
      S.flags.tradeHeat=Math.min(0.2,(S.flags.tradeHeat||0)+0.05);
      S.flags.complainCount=(S.flags.complainCount||0)+1;
      if(S.flags.complainCount>=2)unlockTrait("ambience","兩度向媒體公開抱怨交易傳聞");
      if(chance(0.6)){ tradeToNewTeam("公開抱怨後，球團決定完成交易"); done(true); }
      else { story("交易最後沒有成局，但你和高層之間多了一道裂痕。"); done(false); }
    }},
    {label:"保持沉默，專心準備下季（35% 成交）", fn:()=>{
      if(chance(0.35)){ tradeToNewTeam("球員保持沉默，球團仍完成季末交易"); done(true); }
      else { story("傳言就是傳言。下個球季，你仍會穿著原隊球衣。"); done(false); }
    }},
  ],"非明星球員沒有交易否決權；回應只會改變交易成局機率。");
}
function resolveReleaseMarket(rating,done){
  const from=rosterSnapshot(),buyout=buyoutContract(1,"球團主動釋出"),offers=buildReleaseOffers(rating);
  hr(); head("戰力外通告", from.team+"通知：不再保留合約");
  if(buyout)sys("原保障合約剩餘薪資已全額買斷："+fmtMoney(buyout)+"。這筆款項與下一張證明約分開計算。");
  if(!offers.length){
    recordRosterTransaction("RELEASE",from,null,"遭球團釋出，市場上沒有其他報價");
    story("經紀人的電話一直沒有響。沒有球隊願意提供下一張合約。");
    next(null,()=>careerEnding("遭釋出且無人問津"));
    return;
  }
  story("原球團決定釋出你。消息傳開後，仍有球隊願意提供一年證明約；選擇新東家後，下季成績才會記在新隊名下。");
  const opts=offers.map(of=>({label:of.team+"（"+of.league+"・"+of.level+"，1年／年薪"+fmtMoney(of.annual)+"）",fn:()=>{
    acceptMarketOffer(of,"RELEASE");
    extra("遭釋出後再出發！"+of.team+"簽下"+S.name);
    if(of.league==="CPBL"&&from.league!=="CPBL") S.honors.push(S.year+" 戰力外返台");
    done();
  }}));
  if(S.age>=33) opts.push({label:"不再接受合約，就此引退",fn:()=>{
    recordRosterTransaction("RELEASE",from,null,"遭球團釋出後選擇引退");
    careerEnding("收到戰力外通告後引退");
  }});
  choices(opts,"證明約與正式 FA 共用簽約引擎，但固定一年、無簽約金，層級與年薪依目前戰力下修。");
}
function moveAndSign(type,to,kind,years,annual,bonus,note){
  const oldContract=S.contract;
  const moved=applyRosterMove(type,Object.assign({},to,{salary:annual}),note);if(!moved)return null;
  if(oldContract&&S.contract===oldContract)endContract(type);
  return signContract(kind,years,annual,bonus,{team:S.team,league:S.league,level:S.level,startYear:S.year+1,guaranteed:true,replace:true,replaceReason:type});
}
function renewCurrentContract(kind,years,annual,bonus,reason){
  if(S.contract)endContract(reason||"EXTENDED");
  const c=signContract(kind,years,annual,bonus,{team:S.team,league:S.league,level:S.level,startYear:S.year+1,guaranteed:true,replace:true,replaceReason:reason||"EXTENDED"});
  if(c)commitNextSeason();return c;
}
function overseasWindow(target){
  /* 旅外年齡之窗：越晚越窄。回傳 {open, need, note}；need 為額外評價門檻 */
  const a=S.age;
  if(target==="NPB"){
    if(a<=26)return {open:true,need:0,note:"年齡之窗全開（26歲以下）"};
    if(a<=31)return {open:true,need:(a-26)*3,note:"年齡之窗收窄中（27-31歲：評價門檻+"+((a-26)*3)+"）"};
    return {open:false,need:99,note:"32歲以上：日職球團不再為重建簽老將"};
  }
  if(a<=25)return {open:true,need:0,note:"年齡之窗全開（25歲以下）"};
  if(a<=28)return {open:true,need:(a-25)*4,note:"年齡之窗急速收窄（26-28歲：評價門檻+"+((a-25)*4)+"）"};
  if(overall()>=70&&chance(0.08))return {open:true,need:15,note:"29歲以上僅頂級好手保留一線生機（8%微機率兌現）"};
  return {open:false,need:99,note:"29歲以上：大聯盟的窗已幾乎關上"};
}
function resolveCareerMove(rating,done,onNone){
  if(S.flags.rosterMoveYear===S.year||S.flags.employmentResolvedYear===S.year){ (onNone||done)(); return; }
  if(S.league==="CPBL"&&(S.leagueYears||0)>=3&&S.fame>=70&&rating>=50&&!S.flags.abroadAsked){
    const wNPB=overseasWindow("NPB"),wMLB=overseasWindow("MLB");
    const okNPB=wNPB.open&&rating>=50+wNPB.need,okMLB=wMLB.open&&rating>=50+wMLB.need;
    if(!okNPB&&!okMLB){
      if(!S.flags["ageWinNote"+S.year]){S.flags["ageWinNote"+S.year]=1;sys("（旅外傳聞歸於平靜——"+wMLB.note+"；"+wNPB.note+"。）");}
    }else{
    S.flags.abroadAsked=1;
    hr(); head("旅外席捲體育版", "日美球團同步遞出報價");
    sys("年齡之窗："+wNPB.note+"／"+wMLB.note);
    choices([].concat(okNPB?[]:[],[

function shouldReleasePlayer(rating){
  return S.flags.releaseCandidateYear===S.year||(overall()<38&&S.age>=30&&rating<35);
}
function resolveRosterMovement(rating,done){
  if(S.flags.rosterMoveYear===S.year||S.flags.employmentResolvedYear===S.year){ done(); return; }
  const c=ensureContract(),expired=!c||c.yearsLeft<=0;
  if(expired){
    if(hasFAEligibility()){resolveFAMarket(rating,done);return;}
    const fallback=()=>{
      if(!S.flags.rehab&&shouldReleasePlayer(rating)){resolveReleaseMarket(rating,done);return;}
      resolveControlledRenewal(rating,done);
    };
    if(S.flags.rehab)fallback();else resolveCareerMove(rating,done,fallback);return;
  }
  if(S.flags.rehab){
    sys("重大傷勢報銷年：保障約照常履行，球團本休賽季不交易、不列戰力外。");
    done(); return;
  }
  const released=shouldReleasePlayer(rating);
  if(released){ resolveReleaseMarket(rating,done); return; }
  maybeExtension(rating,extended=>{
    if(extended){done();return;}
    offseasonTradeCheck(rating,moved=>moved?done():resolveCareerMove(rating,done));
  });
}

      story("交往"+(S.flags.datingYears||1)+"年。你在口袋裡放了一個小盒子放了三個月。她最近看婚禮影片看得入神。");
      choices([

          extra(S.name+"與"+GF[S.gf].name+"完婚！"); S.maxHp=Math.min(120,S.maxHp+5);
          gain("成家的力量：體力上限+5、受傷風險略降"); nextStep(); }},
        {label:"再等等（分手風險逐年累積）", fn:nextStep},
      ]);
    });
  }
  // 生子鏈：最多四個，機率遞減；每胎帶來一次成長
  if(S.married){
    steps.push(()=>{
      const kids=S.flags.children||(S.child?1:0);
      const pKid=[0.4,0.3,0.2,0.12][kids];
      if(pKid!=null&&chance(pKid)){
        S.flags.children=kids+1;S.child=true;
        ev(["第一個孩子出生了！你在球衣袖口繡上了小小的名字縮寫。","第二個孩子報到！客廳的全壘打牆貼紙旁多了一排身高刻度。","第三個孩子出生！家裡的手套從兩隻變成一整籃。","第四個孩子誕生——你湊滿了一個內野！"][kids]);
        yarukiUp(2);const m=spGain(2,2,2);gain("當爸爸的力量："+m);
      }
      nextStep();
    });
  }
  // 衰退
  if(S.age>=effectiveDeclineAge()){
    steps.push(()=>{
      loss("歲月的帳單：──能力值下滑");
      if(S.pos==="B"||S.twoWay){ S.power=Math.max(1,S.power-(S.twoWay?4:6)); S.run=Math.max(1,S.run-(chance(0.5)?1:0)); }
      if(S.pos==="P"){ S.velo=Math.max(100,S.velo-ri(1,2)); S.stam=Math.max(1,S.stam-(S.twoWay?4:5)); }
      statusBar();
      nextStep();
    });
  }
  // 引退判斷
  steps.push(()=>{
    if(S.flags.committedNextSeasonYear===S.year){
      story("你已接受新東家／新舞台的邀請，休季結束後將按約向球隊報到。");
      nextSeason(); return;
    }
    if(S.age>=33 || (S.age>=effectiveDeclineAge()&&S.age>=31)){
      hr(); head("冬天的抉擇", S.age+"歲的十字路口");
      const future=S.contract&&S.contract.yearsLeft>0?S.contract.annual*S.contract.yearsLeft:0;
      return choices([
        {label:"再戰一年！", fn:()=>{ story("「還能打。」你對著鏡子裡的自己說。"); nextSeason(); }},
        {label:"光榮引退"+(future?"（主動退休，放棄未來保障"+fmtMoney(future)+"）":""), fn:()=>{if(S.contract)endContract("PLAYER_RETIRE");careerEnding("光榮引退");}},
      ],future?"球團主動釋出才需買斷；球員自願退休不領取尚未履行年度薪資。":"身體會說話，但心也會。");
    }
    nextSeason();
  });
  let si=0;
  function nextStep(){ statusBar(); if(si<steps.length){ steps[si++](); } }
  function nextSeason(){
    if(clearRehabAfterSeason()) sys("（完整復健球季結束，身體終於走出手術陰影。）");
    if((S.flags.tradeHeat||0)>0) S.flags.tradeHeat=Math.max(0,S.flags.tradeHeat-0.02);
    S.year++; S.age++;
    next(S.year+"年球季，開幕──", careerLoop);
  }
  nextStep();
}

function intlEvents(){
  const y=S.year, list=[];
  if(y>=2029 && (y-2029)%3===0) list.push({key:"INTL.WBC",name:"世界棒球經典賽", tier:3, fame:55, ov:60, top:true});
  if(y>=2028 && (y-2028)%4===0) list.push({key:"INTL.OLYMPICS",name:"奧運棒球", tier:3, fame:50, ov:58, top:true});
  if(y>=2027 && (y-2027)%4===0) list.push({key:"INTL.PREMIER12",name:"世界12強賽", tier:3, fame:45, ov:55, top:true});
  if(y>=2026 && (y-2026)%4===0) list.push({key:"INTL.ASIAN_GAMES",name:"亞洲運動會", tier:2, fame:35, ov:50});
  if(y%2===0) list.push({key:"INTL.U23_WORLD_CUP",name:"U23世界盃", tier:2, fame:25, ov:48, maxAge:23});
  if((y-2025)%2===0) list.push({key:"INTL.ASIAN_CHAMPIONSHIP",name:"亞洲棒球錦標賽", tier:1, fame:22, ov:44});
  return list;
}
function intlQualify(e){
  if(S.fame < e.fame) return false;
  if(overall() < e.ov) return false;
  if(e.maxAge && S.age > e.maxAge) return false;
  if(e.top && !(S.level==="一軍"||S.level==="MLB"||S.level==="AAA")) return false;
  return true;
}
function pickIntl(){
  if(S.flags.rehab){
    if(S.fame>=18&&!S.flags["intlMiss"+S.year]){S.flags["intlMiss"+S.year]=1;sys("（國家隊名單公布——復健中的你以醫療證明豁免本屆徵召，義務年限順延。）");}
    return null;
  }
  const evts=intlEvents().sort((a,b)=>b.tier-a.tier);
  for(const e of evts){ if(intlQualify(e)) return e; }
  // 有賽事但沒入選：給落選訊息（有點知名度才顯示）
  if(evts.length && S.fame>=18 && !S.flags["intlMiss"+S.year]){
    S.flags["intlMiss"+S.year]=1;
    sys("（"+evts[0].name+"中華隊名單公布……沒有你的名字。門檻：知名度"+evts[0].fame+"＋戰力"+evts[0].ov+(evts[0].top?"＋最高層級":"")+"）");
  }
  return null;
}
function nationalTeamPower(evt){

  const h=xmur3([S.seed,evt.key,S.year,"TEAM_TW_POWER_V1"].join("|")),pr=sfc32(h(),h(),h(),h());
  return Math.round(42+pr()*28);
}

function intlTournamentBody(evt, done){

    choices([

      {label:"一般出賽", fn:()=>ig("norm")},

    function ig(c){
      if(c==="full")S.fatigue=Math.min(100,(S.fatigue||0)+4);
      const win=chance(Math.max(0.12,Math.min(0.88,0.45+(overall()-50)*0.004+(c==="full"?0.06:0)+
        traitGameEdge({international:true,keyGame:evt.tier>=2,batting:S.pos==="B"||S.twoWay}))));
      const statLine=recordQuickEvent({
        id:S.seed+"::"+evt.key+"::"+S.year+"::prelim"+g,

        team:"中華隊",opponent:foe+"代表",result:win?"W":"L",choice:c,
        difficulty:6+evt.tier,innings:9
      });
      if(win){w++; gameLine("　勝！全台轉播收視飆高。"+(statLine?"　你："+statLine:"")); S.fame+=2+evt.tier;}
      else gameLine("　惜敗……"+(statLine?"　你："+statLine:""));
      const go=()=>next(null,()=>intlGame(g+1));

  function intlFinal(){
    const playerBoost=Math.min(8,w*2+Math.max(0,Math.round((overall()-55)*0.15)));
    const score=teamPow+playerBoost;

      story(w===0?"預賽止步。……穿上這件球衣的重量，你記住了。":"全隊實力的天花板壓在那裡——預賽力戰仍止步分組。個人再猛，也扛不動整支球隊。");
      S.flags["intlPlace"+evt.key+S.year]="分組止步";

    if(evt.tier===3&&S.flags.rivalNPB) story("何俊毅先發六局好投退場，走下投手丘時朝你點了點頭——接下來，看你的了。");

      matchKey:S.seed+"::"+evt.key+"::"+S.year+"::key",onEnd:(win)=>{
      const medalGame=S.flags["intlMedalGame"+S.year]||"銅牌戰";
      const medal=medalGame==="金牌戰"?(win?"金牌":"銀牌"):(win?"銅牌":"殿軍");
      S.flags["intlPlace"+evt.key+S.year]=medal;
      const medalPts={金牌:6,銀牌:5,銅牌:4,殿軍:3}[medal];
      if(medal==="金牌")grantTitle("國際賽金牌英雄");
      if(win){
        extra((medalGame==="金牌戰"?"擊敗"+finalFoe+"奪金！":"力克"+finalFoe+"摘銅！")+S.name+"成為全民英雄");
        S.fame+=8*evt.tier+1; S.honors.push(S.year+" "+evt.name+medal);
        S.flags.hof=(S.flags.hof||0)+8*evt.tier;
        if(evt.tier===3&&S.flags.rivalNPB) talk("何俊毅","（把你高高抱起）海線的！我們做到了！！");
        S.flags.intlDeepRuns=(S.flags.intlDeepRuns||0)+1;
        if(S.flags.intlEditions.length>=3&&S.flags.intlDeepRuns>=2)unlockTrait("intlace","至少三度入選國家隊且兩度贏下關鍵戰");
      }else{
        story("惜敗收下"+medal+"……但這件球衣的每個鏡頭，都已刻進全台球迷的記憶。");
        S.honors.push(S.year+" "+evt.name+medal);
        S.fame+=3*evt.tier;
      }
      const m=spGain(medalPts,medalPts,medalPts);

  st.push({label:"高中 ・ "+(typeof SCHOOL!=="undefined"?SCHOOL:"海線高中"),from:hsStart,to:hsStart+2});

  (S.proYears||[]).forEach(y=>{
    const key=(LEAGUE_CN[y.league]||y.league)+" ・ "+String(y.team).replace(/\(.*\)$/,"");

      choices([
        {label:"右打", fn:()=>chooseFieldPosition(sd,nm,pos,{hand:"R",posCat:cat}), noEcho:true},
        {label:"左打（近一壘：內野安打+、雙殺-；常吃反手優勢）", fn:()=>chooseFieldPosition(sd,nm,pos,{hand:"L",posCat:cat}), noEcho:true},
        {label:"左右開弓（永遠反手優勢；初始接觸-1、接觸升級成本+15%）", fn:()=>chooseFieldPosition(sd,nm,pos,{hand:"S",posCat:cat}), noEcho:true},
      ],"選擇打席：");
    }else if(pos==="TW"){
      choices([
        {label:"右投左打（大谷型）", fn:()=>chooseFieldPosition(sd,nm,"P",{hand:"L",throwHand:"R",twoWay:true}), noEcho:true},
        {label:"右投右打", fn:()=>chooseFieldPosition(sd,nm,"P",{hand:"R",throwHand:"R",twoWay:true}), noEcho:true},
        {label:"左投左打（稀少價值：選秀評價+、天生剋左打）", fn:()=>chooseFieldPosition(sd,nm,"P",{hand:"L",throwHand:"L",twoWay:true}), noEcho:true},
      ],"選擇二刀流慣用手：投打共用能力點，必須取捨養成方向。");
    }else{
      choices([
        {label:"右投右打", fn:()=>initGame(sd,nm,pos,{hand:"R",throwHand:"R"}), noEcho:true},
        {label:"左投左打（稀少價值：選秀評價+、天生剋左打）", fn:()=>initGame(sd,nm,pos,{hand:"L",throwHand:"L"}), noEcho:true},
      ],"選擇投打：");
    }
  }
}
function chooseFieldPosition(seed,name,pos,hd){
  const cat=hd&&hd.posCat;
  if(cat==="C"){ initGame(seed,name,pos,Object.assign({},hd,{fieldPos:"C"})); return; }
  hr();head("守位登錄",pos==="P"?"二刀流副守位申請":cat==="IF"?"內野守備位置申請":cat==="OF"?"外野守備位置申請":"野手守備位置申請");
  const labels={C:"捕手 C","1B":"一壘手 1B","2B":"二壘手 2B","3B":"三壘手 3B",SS:"游擊手 SS",LF:"左外野手 LF",CF:"中外野手 CF",RF:"右外野手 RF"};
  const notes={C:"肩力與守備", "1B":"守備穩定", "2B":"守備與跑力", "3B":"肩力與反應", SS:"守備、肩力與跑力",
    LF:"守備與跑力",CF:"守備範圍與跑力",RF:"肩力與守備"};
  const pool=cat==="IF"?["1B","2B","3B","SS"]:cat==="OF"?["LF","CF","RF"]:FIELD_POS_ORDER;
  choices(pool.map(code=>({
    label:labels[code]+"｜適性看"+notes[code],
    primary:code===(cat==="IF"?"SS":"CF"),
    noEcho:true,
    fn:()=>initGame(seed,name,pos,Object.assign({},hd,hd&&hd.twoWay?{secondaryPos:code}:{fieldPos:code}))
  })),hd&&hd.twoWay?"投手固定登錄 P；此處選擇非登板日可使用的副守位。守位適性會依跑力、肩力、守備即時計算。":"守位不是裝飾資料：個人頁會列出各位置即時適性與頂級聯盟門檻，達不到門檻會在季末被迫轉守位。");
}
/* 創角球種配備：依左右投顯示各球種優劣勢，選滿 n 顆開局；生涯中仍可花點數再配備新球種 */
function choosePitchLoadout(n,done){
  const picked=pitchNames(S);
  if(picked.length>=n){ normalizeBreakSpread(S); statusBar();
    sys("球種配備完成："+picked.join("・")+"。之後點數只投入「變化球」單一數值，各球種自動平均進修；配備的球種組合決定左右打對戰優劣勢。");
    done(); return; }
  hr(); head("球種配備","選擇第"+(picked.length+1)+"顆球種（共"+n+"顆・"+(S.throwHand==="L"?"左投":"右投")+"）");
  const handHint=(bn)=>{
    const m=PITCH_META[bn]||{};
    if(S.throwHand==="L"){
      if((m.opp||0)>0.02)return "對右打特效（左投面對較多右打：吃香）";
      if((m.same||0)>0.02)return "剋左打（左投對左壓制疊加）";
    }else{
      if((m.opp||0)>0.02)return "對左打特效（變速系是右投對左法寶）";
      if((m.same||0)>0.02)return "剋右打（右投對右壓制）";
    }
    return "左右打均衡";
  };
  choices(Object.keys(BREAK_POOL).filter(bn=>!S.breaks[bn]).map(bn=>({
    label:"【"+bn+"】"+((PITCH_META[bn]||{}).tip||"")+"｜"+handHint(bn),
    noEcho:true,
    fn:()=>{ S.breaks[bn]=1; gain("配備球種【"+bn+"】"); choosePitchLoadout(n,done); }
  })),"球種是「配備」不是各自練等：威力全看你的「變化球」評級。滑球剋同側、變速剋異側且省力、指叉三振多但傷手臂、伸卡滾地機器、曲球均衡。");
}
function initGame(seed, name, pos, hd){
  if(typeof resetUIShell==="function")resetUIShell();
  seedRNG(seed, 0);
  S=newState(seed, name, pos);
  if(window.__pickNo)S.jersey=window.__pickNo;
  if(hd){ S.hand=hd.hand||"R"; S.throwHand=hd.throwHand||"R"; }
  S.twoWay=!!(hd&&hd.twoWay);
  S.fieldPos=pos==="P"?"P":((hd&&hd.fieldPos)||"CF");
  S.secondaryPos=S.twoWay?((hd&&hd.secondaryPos)||"RF"):null;
  if(S.hand==="S"){ S.meet=Math.max(1,S.meet-1); }
  if(S.fieldPos==="C"&&pos!=="P"){
    /* 捕手開局：守備與肩力起步較好、跑力略差；配球腦反映在技術點起步 */
    S.fld=Math.min(15,S.fld+2); S.run=Math.max(1,S.run-1); S.expG+=6;
  }
  if(pos==="P"){
    /* 高中科班新生的投手底子；耐力仍只有 D，開局只能從牛棚出發。 */
    S.velo=126;S.ctrl=78;S.stam=86;S.breaks={};
  }
  if(S.twoWay){
    /* 16 歲同時練投打仍很生澀：雙面都有底子，但沒有一面能吃滿單一路線資源。 */
    S.velo=Math.max(100,S.velo-2);
    S.ctrl=Math.max(1,S.ctrl-6);
    S.stam=Math.max(1,S.stam-4);
    S.power=Math.max(1,S.power-4);
    S.run=Math.max(1,S.run-1);
    S.fld=Math.max(1,S.fld-1);
    /* 雙重課表壓縮恢復空間；暑訓與休息仍沿用既有體力機制。 */
    S.maxHp=90;
    S.hp=65;
  }
  ensurePlayerSystems(S);
  S.flags.initialOverall=overall();
  $log().innerHTML="";
  statusBar();
  sys("種子："+seed+"　路線："+(S.twoWay?"二刀流":pos==="P"?"投手":S.fieldPos==="C"?"捕手":["1B","2B","3B","SS"].includes(S.fieldPos)?"內野手":"外野手")+"　登錄守位："+fieldPositionLabel()+"（"+fieldPositionShort()+"）");
  sys("提示：22 歲前開季能力骰累積擲出 5 顆「6」，可覺醒隱藏素質「天才」；此外還有多種只在特定人生軌跡上出現的隱藏特性——有些，要到引退那天才會揭曉。");
  if(S.fieldPos==="C"&&pos!=="P")sys("捕手特典：全隊投手失分抑制（配球加成）、「配球師」養成加速；代價是跑力起步-1。頂級聯盟守不住捕手時，會沿 C→1B→DH 一路讓位。");
  if(pos==="P")sys("投手定位：目前耐力評級 "+ratingOf("stam",S.stam)+"，先從"+pitchRoleLabel(recommendPitchRole())+"出發；耐力評級 60（內部110）以上才具固定先發容量。");
  if(S.twoWay) sys("二刀流代價：投打共用三系能力點；體力上限90，非保養練習體力消耗+15%、受傷風險+25%。");
  if(pos==="P"){ choosePitchLoadout(2,opening); return; }
  opening();
}

/* 裝備道具的練習加成 */
const _origPractice = practice;
practice = function(kind){
  let msg=null;
  if(S.items.includes("飛翔球棒") && ["suburi","toss"].includes(kind)){ S.expG+=3; msg="【飛翔球棒】技術+3"; }
  if(S.items.includes("職人手套") && kind==="knock"){ S.expG+=2; S.expS+=2; msg="【職人手套】技+2敏+2"; }
  if(S.items.includes("疾風釘鞋") && ["dash","run"].includes(kind)){ S.expS+=3; msg="【疾風釘鞋】+3"; }
  if(msg) sys("裝備加成："+msg);
  _origPractice(kind);
};

window.addEventListener("DOMContentLoaded", startScreen);

</script>
